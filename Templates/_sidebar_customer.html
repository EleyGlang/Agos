<!-- ══ CUSTOMER SIDEBAR ══ -->
<aside id="sidebar" class="fixed top-0 left-0 bottom-0 z-40 flex flex-col overflow-y-auto transition-transform duration-300 w-[260px] md:translate-x-0 -translate-x-full agos-sidebar">
  <div class="agos-sidebar-logo-wrap flex items-center gap-3 flex-shrink-0 px-5 py-5">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(145deg,#2d88b8,#0095c8)">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M11 2C11 2 4 9 4 13.5a7 7 0 0014 0C18 9 11 2 11 2z" fill="white" opacity=".95"/></svg>
    </div>
    <div>
      <div class="text-xl font-bold text-white" style="font-family:'Inconsolata',monospace">Agos</div>
      <div class="text-[0.6rem] tracking-widest uppercase" style="color:var(--sidebar-badge-text)">EP-Bluelife System</div>
    </div>
  </div>

  <div class="agos-sidebar-user-wrap flex items-center gap-2.5 mx-3 my-3 rounded-xl p-3">
    <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold text-white flex-shrink-0" style="background:linear-gradient(135deg,#0095c8,#5bb8e0)">{{ session['customer_name'][0].upper() }}</div>
    <div class="min-w-0">
      <div class="text-[0.82rem] font-medium truncate" style="color:rgba(204,234,247,0.90)">{{ session['customer_name'] }}</div>
      <span class="agos-sidebar-role-badge">Customer</span>
    </div>
  </div>

  <nav class="flex-1 py-2">
    <a href="{{ url_for('customer_dashboard') }}" class="agos-sidebar-link {% if active_page == 'customer_dashboard' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" class="mr-2.5 flex-shrink-0"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity=".8"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity=".8"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".8"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".8"/></svg>
      Dashboard
    </a>
    <a href="{{ url_for('customer_order') }}" class="agos-sidebar-link {% if active_page == 'customer_order' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" class="mr-2.5 flex-shrink-0"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Place Order
    </a>
    <a href="{{ url_for('customer_deliveries') }}" class="agos-sidebar-link {% if active_page == 'customer_deliveries' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" class="mr-2.5 flex-shrink-0"><path d="M3 7h9v8H3zM12 9l5 2v4h-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6" cy="16" r="1.5" fill="currentColor"/><circle cx="15" cy="16" r="1.5" fill="currentColor"/></svg>
      My Deliveries
    </a>
    <a href="{{ url_for('customer_profile') }}" class="agos-sidebar-link {% if active_page == 'customer_profile' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" class="mr-2.5 flex-shrink-0"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      My Profile
    </a>
  </nav>

  <div class="agos-sidebar-footer flex-shrink-0 p-3">
    <button class="agos-logout-btn" onclick="openLogoutModal()">Log Out</button>
  </div>
</aside>

<div id="overlay" onclick="closeSidebar()" class="agos-overlay"></div>
